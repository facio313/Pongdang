name: pongdang

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-pongdang}-db
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-pongdang}-backend
    image: pongdang-backend:${RELEASE_SHA:-local}
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_ROOT_PATH: ${API_ROOT_PATH:-}
      SSO_PROXY_SECRET: ${SSO_PROXY_SECRET:-}
      SSO_ALLOWED_ORIGINS: ${SSO_ALLOWED_ORIGINS:-}
      NOTIFICATIONS_PROVIDER: ${NOTIFICATIONS_PROVIDER:-disabled}
      NOTIFICATIONS_DELIVERY_ENABLED: ${NOTIFICATIONS_DELIVERY_ENABLED:-false}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_RESEND_API_KEY: ${NOTIFICATIONS_RESEND_API_KEY:-}
      LIVECAM_ALLOWED_HOSTS: ${LIVECAM_ALLOWED_HOSTS:-}
      WINDY_WEBCAMS_API_KEY: ${WINDY_WEBCAMS_API_KEY:-}
      WINDY_WEBCAMS_RADII_KM: ${WINDY_WEBCAMS_RADII_KM:-2,5,10}
      WINDY_WEBCAMS_DAILY_BUDGET: ${WINDY_WEBCAMS_DAILY_BUDGET:-30}
      WINDY_WEBCAMS_REFRESH_HOURS: ${WINDY_WEBCAMS_REFRESH_HOURS:-24}
      WINDY_WEBCAMS_TIMEOUT_SECONDS: ${WINDY_WEBCAMS_TIMEOUT_SECONDS:-8}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      AI_PRICING_MODEL: ${AI_PRICING_MODEL:-gpt-5.6-luna}
      AI_INPUT_MICROUSD_PER_MILLION_TOKENS: ${AI_INPUT_MICROUSD_PER_MILLION_TOKENS:-200000}
      AI_OUTPUT_MICROUSD_PER_MILLION_TOKENS: ${AI_OUTPUT_MICROUSD_PER_MILLION_TOKENS:-1200000}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_INPUT_BYTES: ${AI_MAX_INPUT_BYTES:-65536}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_MAX_DAILY_CALLS: ${AI_MAX_DAILY_CALLS:-200}
      AI_MAX_DAILY_TOKENS: ${AI_MAX_DAILY_TOKENS:-4000000}
      AI_RESERVED_CALL_MICROUSD: ${AI_RESERVED_CALL_MICROUSD:-20000}
      AI_DAILY_BUDGET_MICROUSD: ${AI_DAILY_BUDGET_MICROUSD:-1000000}
      AI_MAX_MODEL_CALLS: ${AI_MAX_MODEL_CALLS:-3}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-6}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-2}
      AI_PRINCIPAL_REQUESTS_PER_MINUTE: ${AI_PRINCIPAL_REQUESTS_PER_MINUTE:-6}
    depends_on:
      db:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    logging: *logging

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-pongdang}-frontend
    image: pongdang-frontend:${RELEASE_SHA:-local}
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    ports:
      - "127.0.0.1:${HTTP_PORT:-5188}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    logging: *logging

  initialize:
    container_name: ${COMPOSE_PROJECT_NAME:-pongdang}-initialize
    image: pongdang-backend:${RELEASE_SHA:-local}
    build: ./backend
    command: ["python", "-m", "app.schema", "--initialize", "--remove-demo"]
    restart: "no"
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 64
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  collector:
    container_name: ${COMPOSE_PROJECT_NAME:-pongdang}-collector
    image: pongdang-backend:${RELEASE_SHA:-local}
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.ingestion.worker"]
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-pongdang}
      POSTGRES_USER: ${POSTGRES_USER:-pongdang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      KMA_API_HUB_KEY: ${KMA_API_HUB_KEY:-}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      HRFCO_KEY: ${HRFCO_KEY:-}
      NOTIFICATIONS_PROVIDER: ${NOTIFICATIONS_PROVIDER:-disabled}
      NOTIFICATIONS_DELIVERY_ENABLED: ${NOTIFICATIONS_DELIVERY_ENABLED:-false}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_RESEND_API_KEY: ${NOTIFICATIONS_RESEND_API_KEY:-}
      LIVECAM_ALLOWED_HOSTS: ${LIVECAM_ALLOWED_HOSTS:-}
      COLLECTION_LATITUDE: ${COLLECTION_LATITUDE:-37.8034055083}
      COLLECTION_LONGITUDE: ${COLLECTION_LONGITUDE:-128.9102102476}
      COLLECTION_RADIUS_M: ${COLLECTION_RADIUS_M:-20000}
      AWS_STATIONS: ${AWS_STATIONS:-516}
      KHOA_TIDE_STATION_CODE: ${KHOA_TIDE_STATION_CODE:-DT_0006}
      KHOA_BUOY_STATION_CODE: ${KHOA_BUOY_STATION_CODE:-TW_0089}
      KHOA_RIP_BEACH_CODE: ${KHOA_RIP_BEACH_CODE:-GYEONGPO}
      KHOA_CURRENT_STATION_CODE: ${KHOA_CURRENT_STATION_CODE:-HF_0076}
      KHOA_CURRENT_FORECAST_CODE: ${KHOA_CURRENT_FORECAST_CODE:-16LTC10}
      AIR_QUALITY_STATION_NAMES: ${AIR_QUALITY_STATION_NAMES:-종로구}
      ASTRONOMY_LOCATION: ${ASTRONOMY_LOCATION:-서울}
      UV_AREA_CODE: ${UV_AREA_CODE:-1100000000}
      FORECAST_ZONE_CODE: ${FORECAST_ZONE_CODE:-11A00101}
      WATER_QUALITY_STATION_NAME: ${WATER_QUALITY_STATION_NAME:-인천강화}
      VISITOR_STATISTICS_LAG_DAYS: ${VISITOR_STATISTICS_LAG_DAYS:-60}
      VISITOR_REGION_CODE: ${VISITOR_REGION_CODE:-}
      TOURISM_TRADITIONAL_ENABLED: ${TOURISM_TRADITIONAL_ENABLED:-false}
      DAM_RELEASE_ENABLED: ${DAM_RELEASE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-m", "app.ingestion.health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    logging: *logging

volumes:
  postgres_data:
