# Include only in pongdang.site's HTTPS server. Keep the existing OAuth routes
# and protected API auth_request gate unchanged. No CORS or iframe exceptions.
location ~ ^/(?:pongdang/)?api/auth/(state|login)$ {
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_body_timeout 10s;
    include /etc/nginx/snippets/bonifacio-sso-admin-edge-secret.conf;
    proxy_set_header X-Original-Host pongdang.site;
    proxy_set_header Host pongdang.site;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    rewrite ^/(?:pongdang/)?api/auth/(state|login)$ /inline/$1 break;
    proxy_pass http://127.0.0.1:4189;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    # Never persist request bodies, passwords, cookies or OAuth exchanges in logs.
    error_log /var/log/nginx/pongdang-inline-login-error.log crit;
}
