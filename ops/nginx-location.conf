# Guest-capable compute endpoints: 로그인 없이 추천 7단계 → 코스 생성까지
# 끝까지 쓸 수 있어야 하므로, 익명 호출이 SSO 로그인으로 튕기지 않습니다.
# 로그인한 브라우저에는 여전히 auth_request 로 X-Pongdang-SSO-* 헤더가
# 주입되어 저장된 취향 · 활동 기록이 추천에 반영됩니다. 익명 호출만 아래
# @pongdang_guest 로 떨어져 헤더 없이 백엔드에 닿고, 백엔드가 그것을
# 예약 subject(app/auth.py 의 GUEST_SUBJECT)로 받습니다.
#
# 이 라우트들은 **아무것도 저장하지 않습니다**. 저장 경로(POST/GET
# .../travel/plans)는 바로 위 `^~ .../travel/plans` 블록이 계속 막습니다 --
# `location =` 정확 일치가 `^~` 접두사보다 먼저 선택되므로 /plans/draft 만
# 이 문을 씁니다.

location = /pongdang/api/data/travel/recommendations {
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;
    # 익명이면 게이트가 거부합니다. 그 거부를 로그인 화면으로 돌리지 않고
    # 헤더 없는 프록시로 넘깁니다.
    error_page 401 403 = @pongdang_guest;
    rewrite ^/pongdang(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5188;
    proxy_http_version 1.1;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}

