# Login popover lands the browser here to force a fresh SSO check. On
# success this falls through to the same SPA shell as everything else,
# which reads the stored return hash and bounces back into the app.
location = /pongdang/auth/continue {
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;
    rewrite ^/pongdang(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5188;
    proxy_http_version 1.1;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}

# Everything else: static shell + public reads (keywords, capabilities,
# water_index, forecast, tides, quality grade/comparisons, ai status, ...).
# No SSO gate - anonymous visitors can browse freely. Backend still checks
# X-Pongdang-SSO-* per-route (app/auth.py); routes above are the only ones
# whose headers are ever populated by this ingress.
location ^~ /pongdang/ {
    proxy_pass http://127.0.0.1:5188/;
    proxy_http_version 1.1;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}
