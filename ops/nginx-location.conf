# Include inside the existing HTTPS server block. Prefix is stripped once.
location = /pongdang {
    return 308 /pongdang/;
}

location ^~ /pongdang/ {
    # This installed SSO snippet must overwrite ALL X-Pongdang-SSO-* headers
    # from verified auth_request identity/grants plus its server-only token.
    # The include path alone does not prove the identity bridge is configured.
    # See docs/ai-concierge.md before reviewing/installing this host template.
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;
    proxy_pass http://127.0.0.1:5188/;
    proxy_http_version 1.1;
    # Stream larger assets without relying on shared proxy-temp permissions.
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}
