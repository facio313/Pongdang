# Include inside the existing HTTPS server block. Prefix is stripped once.
location = /pongdang {
    return 308 /pongdang/;
}

# Every block below strips the "/pongdang" prefix with `rewrite ... break;`
# before proxy_pass (proxy_pass carries no URI of its own, so nginx forwards
# whatever the rewrite left in $uri). This must match exactly regardless of
# how deep the location prefix goes - unlike proxy_pass's own URI-stripping
# shortcut, which only strips the literal string the location matched and
# would mangle a location like `/pongdang/api/data/travel/preferences` down
# to just `/`.

# Personal-data read/write endpoints: these must run through the SSO
# auth_request so a logged-in browser gets trusted X-Pongdang-SSO-* headers
# injected on every call. An anonymous caller fails auth_request here (its
# installed failure behavior applies - typically a redirect to the SSO login
# page). ^~ prefix locations match longest-prefix-first, so each of these
# takes priority over the catch-all `/pongdang/` block further down.
location ^~ /pongdang/api/data/travel/preferences {
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;
    rewrite ^/pongdang(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5188;
    proxy_http_version 1.1;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}

