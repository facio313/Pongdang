# 익명 호출이 떨어지는 자리. SSO 헤더를 **비우고** 넘깁니다 -- 클라이언트가
# 보낸 X-Pongdang-SSO-* 를 그대로 흘리면 누구나 로그인한 척할 수 있습니다.
location @pongdang_guest {
    rewrite ^/pongdang(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5188;
    proxy_http_version 1.1;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Pongdang-SSO-Token "";
    proxy_set_header X-Pongdang-SSO-Subject "";
    proxy_set_header X-Pongdang-SSO-Grants "";
    proxy_set_header X-Pongdang-SSO-Email "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}

