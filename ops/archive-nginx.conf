server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Also support a direct loopback preview with the production Vite base.
    location /pongdang/ {
        rewrite ^/pongdang/(.*)$ /$1 last;
    }

    # The host's existing Pongdang SSO ingress remains the authentication gate.
    # No upstream, database, or external provider is contacted in archive mode.
    location = /api/ready {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","mode":"archive","live_data":false}';
    }
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"archive"}';
    }
    location ~ ^/api/data/attachments/([1-9][0-9]*)/file$ {
        limit_except GET { deny all; }
        try_files /archive/images/$1.jpg /archive/images/$1.png /archive/images/$1.webp /archive/images/$1.gif =404;
        add_header Cache-Control "private, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 410 '{"detail":"archive_mode_live_api_disabled"}';
    }
    location /archive/ {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "private, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
