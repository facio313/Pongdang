name: pongdang-archive

services:
  frontend:
    container_name: pongdang-frontend
    image: ${PONGDANG_ARCHIVE_IMAGE:?Pinned existing frontend image required}
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    ports:
      - "127.0.0.1:5188:8080"
    volumes:
      - ${PONGDANG_ARCHIVE_PUBLIC:?Public archive directory required}:/usr/share/nginx/html:ro
      - ${PONGDANG_ARCHIVE_NGINX:?Archive nginx configuration required}:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
