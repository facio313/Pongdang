# Include only inside pongdang.site's HTTPS server block.
location @pongdang_api_unauthenticated {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"detail":"SSO_AUTHENTICATION_REQUIRED"}';
}
location @pongdang_api_forbidden {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"detail":"SSO_GRANT_REQUIRED"}';
}
