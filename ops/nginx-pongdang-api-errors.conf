# Include in Pongdang's authenticated API locations after its proxy snippet.
# Browser login entry /pongdang/auth/continue keeps its OAuth2 302 handler.
# Remove any error_page login redirect from that shared proxy snippet; keep it
# explicitly on browser continuation locations so it cannot affect API fetches.
error_page 401 = @pongdang_api_unauthenticated;
error_page 403 = @pongdang_api_forbidden;
