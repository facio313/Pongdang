name: Build and deploy

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.image }} image
    if: github.ref != 'refs/heads/dev' && github.head_ref != 'dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            cache_scope: pongdang-backend
            build_args: ''
          - image: frontend
            context: ./frontend
            cache_scope: pongdang-frontend
            build_args: APP_BASE_PATH=/pongdang/
    concurrency:
      group: pongdang-build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.image }} production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }},version=2,timeout=60s
          cache-to: type=gha,scope=${{ matrix.cache_scope }},version=2,mode=max,timeout=60s

  deploy:
    needs: [build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success'
    concurrency:
      group: pongdang-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check that this is still the latest main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Deployment skipped: a newer main commit is available.'
          fi
      - name: Deploy verified commit to server
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' '[ssh.bonifacio.work]:22022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII91ovdQZMg9NpUyjjFSS0Ra0SEuYuAw4Uv3GTv6J92F' > "$hosts_file"
          ssh -T -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -p 22022 cks@ssh.bonifacio.work "deploy pongdang $DEPLOY_SHA"
