name: Build production images

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.image }} image
    if: github.ref != 'refs/heads/dev' && github.head_ref != 'dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            cache_scope: pongdang-backend
            build_args: ''
          - image: frontend
            context: ./frontend
            cache_scope: pongdang-frontend
            build_args: APP_BASE_PATH=/pongdang/
    concurrency:
      group: pongdang-build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.image }} production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }},version=2,timeout=60s
          cache-to: type=gha,scope=${{ matrix.cache_scope }},version=2,mode=max,timeout=60s
