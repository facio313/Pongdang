server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        # Trusted TLS ingress overwrites these. Backend verifies its server-only
        # token and access-pongdang grant; arbitrary browser headers do not auth.
        proxy_set_header X-Pongdang-SSO-Token $http_x_pongdang_sso_token;
        proxy_set_header X-Pongdang-SSO-Subject $http_x_pongdang_sso_subject;
        proxy_set_header X-Pongdang-SSO-Grants $http_x_pongdang_sso_grants;
        proxy_set_header X-Pongdang-SSO-Email $http_x_pongdang_sso_email;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
